<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <title>Тоҷикӣ Батл - Чархи Иқбол</title>
    <style>
        body { background: radial-gradient(circle, #1a1a1a, #000); color: #fff; text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; margin: 0; padding: 20px; }
        h1 { color: #ffcc00; text-shadow: 2px 2px 10px #ff3300; font-size: 3rem; margin-bottom: 10px; }
        #wheel-container { position: relative; width: 500px; height: 500px; margin: auto; }
        canvas { border: 10px solid #ffcc00; border-radius: 50%; box-shadow: 0 0 50px rgba(255, 204, 0, 0.5); transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }
        #pointer { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-top: 50px solid #ff0000; z-index: 10; filter: drop-shadow(0 0 10px black); }
        .controls { margin-top: 30px; }
        button { background: linear-gradient(45deg, #ffcc00, #ff9900); border: none; padding: 15px 40px; font-size: 1.5rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        button:active { transform: scale(0.95); }
        #result-box { margin-top: 20px; font-size: 2rem; font-weight: bold; color: #00ffcc; min-height: 50px; text-shadow: 0 0 10px #00ffcc; }
    </style>
</head>
<body>

    <h1>🇹🇯 ТОҶИКӢ БАТЛ 🇹🇯</h1>
    <p style="font-size: 1.2rem;">Барои гардиш 1 РОЗА фиристед!</p>

    <div id="wheel-container">
        <div id="pointer"></div>
        <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <div id="result-box">Вазифа интизор аст...</div>

    <div class="controls">
        <button onclick="spin()">ГАРДИШ (SPIN)</button>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const resultBox = document.getElementById('result-box');
        
        // Рӯйхати 20 вазифаи шавқовар барои тоҷикон
        const tasks = [
            "10 ОТЖИМАНИЕ", "ЛАҲҶАИ КӮЛОБӢ", "ЛАҲҶАИ ХУҶАНДӢ", "ПИАР (REKLAMA)", 
            "СУРУДИ ТОҶИКӢ", "20 ПРИСЕДАНИЕ", "ЗАНГИ ШӮХӢ", "РАҚСИ ТОҶИКӢ", 
            "ШЕЪРИ КЛАССИКӢ", "ТЕЗГӮЯК (3 БОР)", "ЛАТИФАИ НАВ", "ТАБРИКОТИ ЗИНДА", 
            "ЛАҲҶАИ ПОМИРӢ", "ЭМОДЗИИ ХАНДАОВАР", "ПЛАНКА (30 СОНИЯ)", "САВОЛИ РОСТ", 
            "БО ЯК ПО ИСТОДАН", "ТАЪРИФИ ХУД", "ЛАҲҶАИ ҒАРМӢ", "СЮРПРИЗ!"
        ];

        const colors = ["#e74c3c", "#3498db", "#f1c40f", "#2ecc71", "#9b59b6", "#e67e22", "#1abc9c", "#d35400"];

        function drawWheel() {
            const numSegments = tasks.length;
            const arcSize = (2 * Math.PI) / numSegments;

            tasks.forEach((task, i) => {
                const angle = i * arcSize;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(250, 250);
                ctx.arc(250, 250, 250, angle, angle + arcSize);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(250, 250);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = "bold 14px Arial";
                ctx.fillText(task, 240, 5);
                ctx.restore();
            });
        }

        let currentRotation = 0;
        function spin() {
            resultBox.innerText = "Чарх дар ҳоли гардиш...";
            const spinAngle = Math.floor(Math.random() * 360) + 3600; // 10 бор давр мезанад
            currentRotation += spinAngle;
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                const actualAngle = (currentRotation % 360);
                const segmentAngle = 360 / tasks.length;
                const winningIndex = Math.floor((360 - actualAngle + (segmentAngle / 2)) % 360 / segmentAngle);
                resultBox.innerText = "ВАЗИФА: " + tasks[winningIndex % tasks.length];
            }, 4000);
        }

        drawWheel();
    </script>
</body>
</html>
