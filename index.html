<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <title>Тоҷикӣ Батл - Чархи Иқбол</title>
    <style>
        body { background: radial-gradient(circle, #1c1c1c, #000); color: #fff; text-align: center; font-family: 'Arial', sans-serif; overflow: hidden; margin: 0; padding: 10px; }
        h1 { color: #ffcc00; text-shadow: 0 0 20px #ff3300; font-size: 2.5rem; margin-top: 10px; }
        .gift-info { font-size: 1.2rem; color: #00ffcc; margin-bottom: 15px; font-weight: bold; }
        #wheel-container { position: relative; width: 450px; height: 450px; margin: auto; }
        canvas { border: 12px solid #ffcc00; border-radius: 50%; box-shadow: 0 0 60px rgba(255, 204, 0, 0.4); transition: transform 4s cubic-bezier(0.1, 0, 0.1, 1); }
        #pointer { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-top: 55px solid #ff0000; z-index: 10; }
        .controls { margin-top: 25px; }
        button { background: linear-gradient(45deg, #ffcc00, #ff9900); border: none; padding: 12px 35px; font-size: 1.4rem; font-weight: bold; border-radius: 50px; cursor: pointer; color: #000; box-shadow: 0 5px 15px rgba(255, 204, 0, 0.3); }
        button:active { transform: scale(0.9); }
        #result-box { margin-top: 20px; font-size: 1.8rem; font-weight: bold; color: #fff; background: rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 10px; min-height: 40px; }
    </style>
</head>
<body>

    <h1>🇹🇯 ТОҶИКӢ БАТЛ 🇹🇯</h1>
    <div class="gift-info">🎁 БАРОИ ГАРДИШ: 1 РОЗА (1 COIN) 🎁</div>

    <div id="wheel-container">
        <div id="pointer"></div>
        <canvas id="wheel" width="450" height="450"></canvas>
    </div>

    <div id="result-box">Вазифаро интизор шавед...</div>

    <div class="controls">
        <button onclick="spin()">ГАРДИШ (SPIN)</button>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const resultBox = document.getElementById('result-box');
        
        // Вазифаҳо бо овозҳои ҳайвонот ва бозиҳои бехатар
        const tasks = [
            "ОВОЗИ ХАР (3 БОР)", "10 ОТЖИМАНИЕ", "ОВОЗИ ХУРӮС", "ПИАР (REKLAMA)", 
            "СУРУДИ ТОҶИКӢ", "20 ПРИСЕДАНИЕ", "ОВОЗИ МАЙМУН", "РАҚСИ ТОҶИКӢ", 
            "ШЕЪРИ КЛАССИКӢ", "ТЕЗГӮЯК (3 БОР)", "ЛАТИФАИ НАВ", "ОВОЗИ ГУРБА", 
            "ОВОЗИ САГ", "ЭМОДЗИИ ХАНДАОВАР", "ПЛАНКА (30 СОНИЯ)", "САВОЛИ РОСТ", 
            "ОВОЗИ ГУСФАНД", "ТАЪРИФИ ХУД", "ОВОЗИ ШЕР (РРР)", "СЮРПРИЗ!"
        ];

        const colors = ["#e74c3c", "#3498db", "#f1c40f", "#2ecc71", "#9b59b6", "#e67e22", "#1abc9c", "#d35400"];

        function drawWheel() {
            const numSegments = tasks.length;
            const arcSize = (2 * Math.PI) / numSegments;

            tasks.forEach((task, i) => {
                const angle = i * arcSize;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(225, 225);
                ctx.arc(225, 225, 225, angle, angle + arcSize);
                ctx.fill();
                ctx.strokeStyle = "rgba(0,0,0,0.2)";
                ctx.stroke();

                ctx.save();
                ctx.translate(225, 225);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = "bold 13px Arial";
                ctx.fillText(task, 215, 5);
                ctx.restore();
            });
        }

        let currentRotation = 0;
        let isSpinning = false;

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            resultBox.innerText = "⏳ Чарх дар ҳоли гардиш...";
            
            const spinAngle = Math.floor(Math.random() * 360) + 3600; 
            currentRotation += spinAngle;
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                const actualAngle = (currentRotation % 360);
                const segmentAngle = 360 / tasks.length;
                const winningIndex = Math.floor((360 - actualAngle + (segmentAngle / 2)) % 360 / segmentAngle);
                resultBox.innerText = "🎯 ВАЗИФА: " + tasks[winningIndex % tasks.length];
                isSpinning = false;
            }, 4000);
        }

        drawWheel();
    </script>
</body>
</html>
