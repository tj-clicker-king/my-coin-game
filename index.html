<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOR & CLEAN Coin</title>
    <style>
        body { background: radial-gradient(circle, #1a1a1a, #000); color: white; text-align: center; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .score-container { background: rgba(255, 255, 255, 0.05); padding: 20px 40px; border-radius: 20px; border: 1px solid gold; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); margin-bottom: 30px; }
        .score { font-size: 45px; font-weight: bold; color: #ffd700; }
        .coin-wrapper { position: relative; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
        #coin { width: 250px; height: 250px; border-radius: 50%; background: url('https://img.icons8.com/emoji/256/gold-coin-emoji.png') no-repeat center; background-size: contain; transition: transform 0.1s; filter: drop-shadow(0 0 15px gold); }
        #coin:active { transform: scale(0.92); }
        .plus-one { position: absolute; color: gold; font-size: 24px; font-weight: bold; pointer-events: none; animation: moveUp 0.8s ease-out forwards; }
        @keyframes moveUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>
    <div class="score-container">
        <div style="font-size: 14px; color: #aaa;">БАЛАНСИ ШУМО</div>
        <div class="score" id="balance">0</div>
    </div>
    <div class="coin-wrapper" id="coin-click">
        <div id="coin"></div>
    </div>

    <script>
        let count = localStorage.getItem('coins') ? parseInt(localStorage.getItem('coins')) : 0;
        const balanceDisplay = document.getElementById('balance');
        const coinClick = document.getElementById('coin-click');
        balanceDisplay.innerText = count.toLocaleString();

        coinClick.onclick = (e) => {
            count++;
            localStorage.setItem('coins', count);
            balanceDisplay.innerText = count.toLocaleString();

            // Эффекти +1
            const plus = document.createElement('div');
            plus.innerText = '+1';
            plus.className = 'plus-one';
            plus.style.left = e.clientX - 20 + 'px';
            plus.style.top = e.clientY - 50 + 'px';
            document.body.appendChild(plus);
            setTimeout(() => plus.remove(), 800);

            if (navigator.vibrate) navigator.vibrate(5);
        };
    </script>
</body>
</html>
