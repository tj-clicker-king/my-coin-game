<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бозии Танга</title>
    <style>
        body { background: #121212; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .score { font-size: 35px; margin-bottom: 20px; background: rgba(255,255,255,0.1); padding: 15px 30px; border-radius: 20px; border: 2px solid gold; }
        #coin { width: 220px; height: 220px; background: linear-gradient(45deg, #ffd700, #ffae00); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 100px; cursor: pointer; transition: 0.1s; box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); user-select: none; border: 8px solid #cc8e00; }
        #coin:active { transform: scale(0.95); box-shadow: 0 0 10px rgba(255, 215, 0, 0.8); }
    </style>
</head>
<body>
    <div class="score">Тангаҳо: <span id="balance">0</span></div>
    <div id="coin">💰</div>
    <script>
        let count = 0;
        const balance = document.getElementById('balance');
        document.getElementById('coin').onclick = () => {
            count++;
            balance.innerText = count;
        };
    </script>
</body>
</html>
